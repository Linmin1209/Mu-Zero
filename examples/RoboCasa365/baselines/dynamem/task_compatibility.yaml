# DynaMem vs RoboCasa365 benchmark tasks (50 tasks in task_sets.yaml).
#
# status:
#   na              - out of DynaMem scope (leave success_rate empty)
#   navigate_only   - navigate(A) only
#   ovmm            - pick(A)+place(B) decomposed pipeline on sim
#   composite_na    - multi-step workflow beyond single OVMM command
#
# RoboCasa365 sim uses Panda-Omron. eval_dynamem_robocasa365.py runs sim oracle baseline.

defaults:
  stretch_repo: /HOME/sysu_xdliang/sysu_xdliang_1/HDD_POOL/linmin/stretch_ai
